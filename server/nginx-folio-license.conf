# 页间激活服务器：helloxxy.com/api/folio/ 交给本机 8787 端口的 folio-license 服务。
# deploy.sh 把它放进宝塔站点的扩展配置目录（/www/server/panel/vhost/nginx/extension/helloxxy.com/），
# 站点主配置不用改。^~ 让它优先于站点里按扩展名匹配的 location。
location ^~ /api/folio/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    client_max_body_size 16k;
}
