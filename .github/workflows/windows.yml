name: Windows

# Builds the Windows installer on a Windows machine, installs it, and tests the installed app.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'build/**'
      - 'tests/**'
      - 'samples/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/windows.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EVIDENCE: ${{ github.workspace }}\evidence
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner's screen is 1024 × 768, which squeezes 页间's 1536 × 1024 window into its
      # compact layout. The Mac runs the tests at full size, so this does too.
      - name: Use a 1920 × 1080 screen
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System.Runtime.InteropServices;
          public static class Display {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
              public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2;
              public int dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern bool EnumDisplaySettings(string device, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)]
            public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          '@
          $dm = New-Object Display+DEVMODE
          $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [void][Display]::EnumDisplaySettings($null, -1, [ref]$dm)
          $dm.dmPelsWidth = 1920
          $dm.dmPelsHeight = 1080
          $dm.dmFields = 0x180000
          $result = [Display]::ChangeDisplaySettings([ref]$dm, 0)
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "ChangeDisplaySettings: $result, screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      - name: Unit tests
        run: npm test

      - name: Build installer
        run: |
          npm run build
          npx electron-builder --win nsis --x64 --publish never

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Folio-*-win-x64-setup.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S'
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter Folio.exe | Select-Object -First 1
          if (-not $exe) { throw 'Folio.exe was not installed' }
          "FOLIO_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          Write-Host "Installed to $($exe.FullName)"

      # The steps below run whenever the app got installed, so one run reports every failure.
      - name: Check Explorer integration
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        shell: pwsh
        run: |
          $progids = Get-ItemProperty 'HKCU:\Software\Classes\.html\OpenWithProgids'
          if ($progids.PSObject.Properties.Name -notcontains 'Folio.HTML') { throw '.html is not in Open with' }
          $htm = Get-ItemProperty 'HKCU:\Software\Classes\.htm\OpenWithProgids'
          if ($htm.PSObject.Properties.Name -notcontains 'Folio.HTML') { throw '.htm is not in Open with' }
          $default = (Get-ItemProperty 'HKCU:\Software\Classes\.html' -ErrorAction SilentlyContinue).'(default)'
          if ($default -eq 'Folio.HTML') { throw 'the installer took over the default program for .html' }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\Folio.HTML\shell\open\command').'(default)'
          if ($command -ne "`"$env:FOLIO_EXE`" `"%1`"") { throw "unexpected open command: $command" }

          # WScript.Shell cannot read these shortcuts' targets; look for the exe name in the file.
          $links = Get-ChildItem ([Environment]::GetFolderPath('Programs')) -Filter *.lnk | Where-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            [Text.Encoding]::Unicode.GetString($bytes).Contains('Folio.exe') -or
              [Text.Encoding]::ASCII.GetString($bytes).Contains('Folio.exe')
          }
          if (-not $links) { throw 'no Start menu shortcut' }
          Write-Host "Start menu shortcut: $($links[0].Name)"

      - name: Test the installed app
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        run: node tests/windows.e2e.mjs
        env:
          FOLIO_EVIDENCE: ${{ env.EVIDENCE }}

      # Downloads the speech recognition model, so the development build's run below finds it.
      - name: Voice conversation (installed app)
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 15
        run: node tests/voice.e2e.mjs
        env:
          FOLIO_APP: ${{ env.FOLIO_EXE }}
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\voice-installed

      # The suites the Mac runs, on the development build. One step each, so a failure in one
      # does not hide the others.
      - name: 'Reading, notes and pen (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\e2e
      - name: 'Annotations (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/annotations.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\annotations
      - name: 'Reading interactions (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/reading-interactions.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\reading-interactions
      - name: 'Zoom (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/zoom.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\zoom
      - name: 'PDF (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/pdf.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\pdf
      - name: 'Tabs (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/tabs.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\tabs
      - name: 'Text width (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/text-width.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\text-width
      - name: 'Source editing (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/source.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\source
      - name: 'Opening files (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/open-file.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\open-file
      - name: 'AI assistant (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/ai.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\ai
      - name: 'Whiteboard, papers and themes (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        run: node tests/board-papers.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\board-papers
      - name: 'Settings, model picks, notes prompts, storage and new files'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 10
        shell: bash
        run: |
          node tests/settings.e2e.mjs
          node tests/model-picks.e2e.mjs
          node tests/companion-prompt.e2e.mjs
          node tests/storage.e2e.mjs
          node tests/new-file.e2e.mjs
          node tests/ui-type.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\settings-features
      - name: 'Voice conversation (development build)'
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        timeout-minutes: 15
        run: node tests/voice.e2e.mjs
        env:
          FOLIO_QA_DIR: ${{ env.EVIDENCE }}\voice

      # Codex (the ChatGPT provider) installed the usual Windows way, with npm as codex.cmd.
      - name: Find Codex installed with npm
        if: ${{ !cancelled() }}
        run: |
          npm install -g @openai/codex
          node tests/codex-found.mjs

      - name: Uninstall and check cleanup
        if: ${{ !cancelled() && env.FOLIO_EXE }}
        shell: pwsh
        run: |
          $dir = Split-Path $env:FOLIO_EXE
          $uninstaller = Get-ChildItem $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $uninstaller.FullName -ArgumentList '/S'
          for ($i = 0; $i -lt 60 -and (Test-Path $env:FOLIO_EXE); $i++) { Start-Sleep 1 }
          if (Test-Path $env:FOLIO_EXE) { throw 'Folio.exe is still installed' }
          if (Test-Path 'HKCU:\Software\Classes\Folio.HTML') { throw 'Folio.HTML was not removed' }
          $progids = Get-ItemProperty 'HKCU:\Software\Classes\.html\OpenWithProgids' -ErrorAction SilentlyContinue
          if ($progids -and $progids.PSObject.Properties.Name -contains 'Folio.HTML') { throw 'Open with entry was not removed' }

      # Installs its own 0.0.1 and lets it update itself to 0.0.2, so it runs after the uninstall.
      - name: Test automatic update
        if: ${{ !cancelled() }}
        run: node tests/update.e2e.mjs
        env:
          FOLIO_EVIDENCE: ${{ env.EVIDENCE }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-screenshots
          path: evidence
          if-no-files-found: ignore
          retention-days: 14
