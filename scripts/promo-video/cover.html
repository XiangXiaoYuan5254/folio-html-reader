<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>页间 Folio 视频封面</title>
    <!--
      cover.mjs 截图。?v= 选哪一版（见下面的 <template>），?r=16x9（1920×1080，B 站 / YouTube）
      或 ?r=3x4（1080×1440，小红书 / 抖音）。截图素材都来自官网 website/assets。
    -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      :root {
        --paper: #f6f3ec;
        --ink: #1b211e;
        --ink-2: #464e49;
        --green-800: #1b4a40;
        --green-700: #22594d;
        --green-500: #3d8574;
        --gold: #e2bb63;
        --coral: #d6453a;
        --violet: #6a5ae0;
        --title: 'Lantinghei SC', 'PingFang SC', sans-serif;
        --serif: 'Songti SC', serif;
        --latin: 'Iowan Old Style', Palatino, serif;
        --hand: 'Kaiti SC', 'STKaiti', serif;
        --cute: 'HanziPen SC', 'Hannotate SC', cursive;
        --cute-ink: #3d3a4b;
      }
      html,
      body {
        background: var(--paper);
      }
      #cover {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle, rgba(34, 89, 77, 0.13) 2px, transparent 2.6px) 0 0 / 36px 36px,
          var(--paper);
        font-family: 'PingFang SC', sans-serif;
        color: var(--ink);
      }
      .r3x4 #cover {
        width: 1080px;
        height: 1440px;
      }
      .r4x3 #cover {
        width: 1440px;
        height: 1080px;
      }
      #v,
      #v > * {
        position: absolute;
      }
      #v {
        inset: 0;
      }
      #ink {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      .glow {
        position: absolute;
        right: -200px;
        top: -80px;
        width: 1400px;
        height: 1100px;
        background:
          radial-gradient(closest-side, rgba(61, 133, 116, 0.3), transparent),
          radial-gradient(closest-side at 30% 75%, rgba(226, 187, 99, 0.35), transparent);
        filter: blur(40px);
      }
      .r3x4 .glow {
        right: -300px;
        top: 500px;
      }

      /* ---------- 文案 ---------- */
      .copy {
        left: 112px;
        top: 112px;
      }
      .r3x4 .copy {
        left: 84px;
        top: 92px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font: 700 44px/1 var(--serif);
        letter-spacing: 0.06em;
      }
      .brand img {
        width: 72px;
        height: 72px;
      }
      .brand .en {
        font: 500 40px/1 var(--latin);
        color: var(--ink-2);
        letter-spacing: 0;
      }
      .brand .what {
        margin-left: 14px;
        padding: 10px 20px;
        border-radius: 999px;
        background: rgba(34, 89, 77, 0.1);
        color: var(--green-800);
        font: 600 26px/1 'PingFang SC', sans-serif;
        letter-spacing: 0.02em;
      }
      h1 {
        margin-top: 64px;
        font: 900 132px/1.2 var(--title);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .r3x4 h1 {
        margin-top: 56px;
        font-size: 138px;
      }
      h1 .q {
        color: var(--coral);
      }
      h1 .mark {
        background: linear-gradient(transparent 60%, rgba(226, 187, 99, 0.85) 60% 93%, transparent 93%);
      }
      h1 .green {
        color: var(--green-700);
      }
      h1 .violet {
        color: var(--violet);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 52px;
        max-width: 820px;
      }
      .r3x4 .chips {
        margin-top: 44px;
        max-width: 912px;
      }
      .chips span {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 24px 14px 18px;
        border-radius: 16px;
        background: #fffdf8;
        box-shadow:
          0 0 0 1.5px rgba(22, 44, 38, 0.1),
          0 6px 16px -6px rgba(22, 52, 44, 0.2);
        font: 600 30px/1 'PingFang SC', sans-serif;
        color: var(--ink-2);
      }
      .chips svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: var(--green-500);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chips.ai svg {
        stroke: var(--violet);
      }
      .chips .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--a);
        box-shadow:
          inset 0 0 0 6px var(--b),
          0 0 0 1.5px rgba(0, 0, 0, 0.12);
      }

      /* ---------- 截图：窗口、卡片 ---------- */
      .window {
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 0 0 1.5px rgba(22, 44, 38, 0.1),
          0 30px 60px -14px rgba(22, 52, 44, 0.35),
          0 80px 140px -40px rgba(22, 52, 44, 0.4);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 40px;
        padding: 0 18px;
        background: #f3f1ea;
        border-bottom: 1px solid #e4dfd2;
      }
      .bar.dark {
        background: #1d222b;
        border-color: #0e1117;
      }
      .bar i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff5f57;
      }
      .bar i:nth-child(2) {
        background: #febc2e;
      }
      .bar i:nth-child(3) {
        background: #28c840;
      }
      .crop {
        background-repeat: no-repeat;
      }
      .card {
        overflow: hidden;
        box-shadow:
          0 0 0 1.5px rgba(22, 44, 38, 0.1),
          0 24px 48px -12px rgba(22, 52, 44, 0.4);
      }
      .pill {
        padding: 12px 16px;
        border-radius: 20px;
        background: #fff;
        box-shadow:
          0 0 0 1.5px rgba(22, 44, 38, 0.1),
          0 18px 40px -12px rgba(22, 52, 44, 0.35);
      }
      .note {
        font: 700 52px/1.3 var(--hand);
        color: var(--coral);
        transform: rotate(-3deg);
        white-space: nowrap;
      }

      /* ---------- 1 白板讲解 ---------- */
      .v-board .window {
        left: 930px;
        top: 136px;
        width: 1060px;
        transform: rotate(-2.5deg);
      }
      .r3x4.v-board .window {
        left: 64px;
        top: 870px;
        width: 1000px;
      }
      .r16x9.v-board .note {
        left: 1290px;
        top: 912px;
      }
      .r3x4.v-board .note {
        left: 684px;
        top: 572px;
        font-size: 50px;
        line-height: 1.25;
        transform: rotate(-5deg);
      }
      .r3x4 .note .wrap {
        display: block;
      }

      /* ---------- 2 像读一本书 ---------- */
      .r16x9.v-book .copy {
        top: 150px;
      }
      .v-book h1 {
        font-size: 136px;
      }
      .r3x4.v-book h1 {
        font-size: 144px;
      }
      .v-book .window {
        left: 975px;
        top: 150px;
        width: 1100px;
        transform: rotate(-2.5deg);
      }
      .r3x4.v-book .window {
        left: 56px;
        top: 860px;
        width: 1060px;
      }
      .v-book .sticky {
        left: 890px;
        top: 735px;
        width: 430px;
        border-radius: 24px;
        transform: rotate(5deg);
      }
      .r3x4.v-book .sticky {
        left: 610px;
        top: 1170px;
        width: 410px;
      }

      /* ---------- 3 随手批注 ---------- */
      .v-annotate .window {
        left: 950px;
        top: 140px;
        width: 1020px;
        transform: rotate(2deg);
      }
      .r3x4.v-annotate .window {
        left: 40px;
        top: 900px;
        width: 1000px;
      }
      .v-annotate .pill {
        left: 1010px;
        top: 900px;
        transform: rotate(-1.5deg);
      }
      .v-annotate .pill .crop {
        width: 780px;
      }
      .r3x4.v-annotate .pill {
        left: 120px;
        top: 1300px;
      }
      .r3x4.v-annotate .pill .crop {
        width: 720px;
      }

      /* ---------- 4 AI 陪你读 ---------- */
      .r16x9.v-ai .copy {
        top: 150px;
      }
      .v-ai h1 {
        font-size: 150px;
      }
      .r3x4.v-ai h1 {
        font-size: 156px;
      }
      .v-ai .window {
        left: 950px;
        top: 170px;
        width: 960px;
        transform: rotate(-2deg);
      }
      .r3x4.v-ai .window {
        left: 50px;
        top: 880px;
        width: 1040px;
      }
      .v-ai .translate {
        left: 1170px;
        top: 700px;
        width: 650px;
        border-radius: 26px;
        transform: rotate(2.5deg);
      }
      .r3x4.v-ai .translate {
        left: 330px;
        top: 1170px;
        width: 690px;
      }

      /* ---------- 5 十套主题 ---------- */
      .r16x9.v-themes .copy {
        top: 160px;
      }
      .v-themes h1 {
        font-size: 140px;
      }
      .r3x4.v-themes h1 {
        font-size: 150px;
      }
      .v-themes .chips {
        max-width: 760px;
        gap: 12px;
      }
      .v-themes .chips span {
        padding: 12px 20px 12px 14px;
        font-size: 28px;
      }
      .r3x4.v-themes .chips {
        max-width: 912px;
      }
      .v-themes .window {
        width: 760px;
        transform: rotate(-2deg);
      }
      .r3x4.v-themes .window {
        width: 740px;
      }

      /* ---------- 6 小页 ---------- */
      .v-cute #cover {
        background:
          radial-gradient(circle, #e9dcc4 2.2px, transparent 2.8px) 0 0 / 36px 36px,
          #fff7e8;
        color: var(--cute-ink);
      }
      .v-cute .glow {
        display: none;
      }
      .hello {
        left: 1060px;
        top: 230px;
      }
      .r3x4 .hello {
        left: 0;
        right: 0;
        top: 96px;
        text-align: center;
      }
      .hello .hi {
        font: 700 64px/1 var(--cute);
        color: #7a7588;
      }
      .hello .name {
        margin-top: 18px;
        font: 400 250px/1 'Wawati SC', var(--cute);
        letter-spacing: 0.04em;
      }
      .hello .en {
        display: inline-block;
        margin-top: 10px;
        font: 700 96px/1 'Chalkboard SE', cursive;
        color: #2f8a78;
        text-decoration: underline wavy #ff9fb6;
        text-decoration-thickness: 7px;
        text-underline-offset: 26px;
      }
      .hello .tag {
        margin-top: 64px;
        font: 700 64px/1 var(--cute);
      }
      .r3x4 .hello .name {
        font-size: 230px;
      }
      .r3x4 .hello .tag {
        margin-top: 56px;
        font-size: 58px;
      }
      .sticker {
        padding: 12px 26px;
        border: 4.5px solid var(--cute-ink);
        border-radius: 20px;
        background: var(--c);
        box-shadow: 6px 7px 0 var(--cute-ink);
        font: 700 46px/1 var(--cute);
        color: var(--cute-ink);
        white-space: nowrap;
      }

      /* ---------- 0 总介绍：全手绘，不用截图 ---------- */
      .v-intro #cover {
        background:
          radial-gradient(circle, #e9dcc4 2.2px, transparent 2.8px) 0 0 / 36px 36px,
          #fff7e8;
        color: var(--cute-ink);
      }
      .v-intro .glow {
        display: none;
      }
      .lockup {
        left: 110px;
        top: 84px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .lockup img {
        width: 80px;
        height: 80px;
      }
      .lockup .cn {
        font: 400 74px/1 'Wawati SC', var(--cute);
        letter-spacing: 0.04em;
      }
      .lockup .en {
        font: 700 52px/1 'Chalkboard SE', cursive;
        color: #2f8a78;
      }
      .lockup .what {
        margin-left: 12px;
        padding: 10px 20px;
        border: 3.5px solid var(--cute-ink);
        border-radius: 999px;
        background: #fff;
        font: 700 30px/1 var(--cute);
      }
      .v-intro .kicker {
        left: 114px;
        top: 200px;
        font-size: 40px;
        transform: rotate(-3deg);
      }
      .v-intro h1 {
        left: 104px;
        top: 300px;
        margin: 0;
        font: 900 140px/1.17 var(--title);
        color: var(--cute-ink);
      }
      .v-intro h1 .ai {
        color: #7a5bd6;
      }
      .v-intro h1 .circ {
        margin: 0 0.12em;
      }
      .v-intro .feat {
        left: 112px;
        top: 846px;
        display: flex;
        gap: 18px;
      }
      .v-intro .feat .sticker {
        position: static;
        padding: 10px 20px;
        font-size: 38px;
      }
      .v-intro .feat .sticker:nth-child(odd) {
        transform: rotate(-2.5deg);
      }
      .v-intro .feat .sticker:nth-child(even) {
        transform: rotate(2deg);
      }
      /* ---------- 简洁版：一个画面、一句话 ---------- */
      .v-dark #cover::after,
      .v-paper #cover::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        opacity: 0.07;
        mix-blend-mode: overlay;
      }
      .v-dark .glow,
      .v-paper .glow,
      .v-hook .glow {
        display: none;
      }
      /* A 暗色：像发布会的产品图 */
      .v-dark #cover {
        background: radial-gradient(1000px 680px at 50% 40%, #1f4c42 0%, #0d241e 46%, #050b09 100%);
        color: #f3efe4;
      }
      .d-icon {
        left: 780px;
        top: 150px;
        width: 360px;
        height: 360px;
        filter: drop-shadow(0 46px 60px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 110px rgba(90, 180, 155, 0.35));
      }
      .d-icon img {
        width: 100%;
        height: 100%;
      }
      .d-copy {
        left: 0;
        right: 0;
        top: 600px;
        text-align: center;
      }
      .d-kicker {
        font: 500 34px/1 'PingFang SC', sans-serif;
        letter-spacing: 0.32em;
        margin-right: -0.32em;
        color: rgba(243, 239, 228, 0.55);
      }
      .d-kicker b {
        margin: 0 0.5em 0 0.2em;
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      .d-title .p {
        margin-right: -0.38em;
      }
      .d-sign {
        left: 0;
        right: 0;
        top: 960px;
        text-align: center;
        font: 500 26px/1 var(--latin);
        letter-spacing: 0.3em;
        color: rgba(243, 239, 228, 0.32);
      }
      .d-title {
        margin-top: 42px;
        font: 900 136px/1.1 var(--serif);
        letter-spacing: 0.04em;
        color: #f6f1e4;
      }
      .d-title em {
        font-style: normal;
        background: linear-gradient(180deg, #f7dc9c 10%, #d6a446 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      /* B 纸页：大字排版 */
      .v-paper #cover {
        background: radial-gradient(1400px 900px at 30% 40%, #f8f5ee 0%, #efe9dc 100%);
        color: #1b211e;
      }
      .p-brand {
        left: 150px;
        top: 110px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 700 34px/1 var(--serif);
        letter-spacing: 0.08em;
      }
      .p-brand img {
        width: 52px;
        height: 52px;
      }
      .p-brand span {
        font: 500 32px/1 var(--latin);
        color: #6b736e;
        letter-spacing: 0;
      }
      .p-title {
        left: 140px;
        top: 300px;
        margin: 0;
        font: 900 156px/1.22 var(--serif);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .p-note {
        left: 560px;
        top: 735px;
        font: 700 54px/1 var(--hand);
        color: #c8402f;
        transform: rotate(-4deg);
        white-space: nowrap;
      }
      .p-sheet {
        left: 1250px;
        top: 120px;
        width: 640px;
        height: 960px;
        padding: 80px 70px;
        background: #fffdf8;
        border-radius: 6px;
        transform: rotate(5deg);
        box-shadow:
          0 1px 2px rgba(40, 30, 10, 0.08),
          0 30px 60px -20px rgba(40, 30, 10, 0.25),
          0 80px 120px -50px rgba(40, 30, 10, 0.3);
        font: 400 27px/2.05 var(--serif);
        color: #3a3f3b;
      }
      .p-sheet .k {
        display: block;
        width: 70px;
        height: 6px;
        border-radius: 3px;
        background: #3d8574;
      }
      .p-sheet h4 {
        margin: 28px 0 26px;
        font: 900 44px/1.3 var(--serif);
        color: #1b211e;
      }
      .p-sheet p {
        margin: 0 0 20px;
        text-align: justify;
      }
      .p-sheet .hl {
        background: linear-gradient(transparent 52%, rgba(226, 187, 99, 0.6) 52% 92%, transparent 92%);
      }
      /* C 讲题：直接给钩子 */
      .v-hook #cover {
        background:
          radial-gradient(circle, rgba(27, 33, 30, 0.1) 2px, transparent 2.6px) 0 0 / 40px 40px,
          #fbfaf6;
      }
      .h-sub {
        left: 124px;
        top: 640px;
        display: flex;
        align-items: center;
        gap: 14px;
        font: 500 38px/1 'PingFang SC', sans-serif;
        color: #5d6661;
        letter-spacing: 0.04em;
      }
      .h-sub img {
        width: 52px;
        height: 52px;
      }
      .h-card {
        left: 1010px;
        top: 170px;
        width: 800px;
        height: 720px;
        padding: 70px 80px;
        border-radius: 10px;
        transform: rotate(2.5deg);
        background:
          linear-gradient(90deg, transparent 58px, rgba(214, 69, 58, 0.35) 58px 60px, transparent 60px),
          repeating-linear-gradient(transparent 0 69px, rgba(60, 100, 170, 0.18) 69px 71px),
          #fffefa;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 30px 60px -20px rgba(30, 40, 60, 0.28);
      }
      .h-title {
        left: 120px;
        top: 230px;
        margin: 0;
        font: 900 128px/1.25 var(--title);
        color: #161a18;
        white-space: nowrap;
      }
      .h-title .r {
        color: #d6453a;
      }
      .h-math {
        position: static;
        padding-left: 30px;
        font: italic 400 64px/140px 'Times New Roman', serif;
        color: #1f3a8a;
        white-space: nowrap;
      }
      .h-math sup {
        font-size: 0.55em;
      }
      .h-fix {
        margin: 46px 0 0 96px;
        font: 700 48px/1.3 var(--hand);
        color: #d6453a;
        transform: rotate(-3deg);
        white-space: nowrap;
      }
      .h-fix i {
        font: italic 400 58px/1 'Times New Roman', serif;
      }
      /* D 烧 token：标题同款钩子，右边是做出来的东西 */
      .v-token #cover {
        background:
          radial-gradient(1100px 620px at 22% 112%, rgba(255, 92, 24, 0.55), transparent 70%),
          radial-gradient(900px 640px at 82% 108%, rgba(255, 150, 50, 0.28), transparent 70%),
          radial-gradient(1200px 800px at 40% 30%, #1d130e 0%, #0b0806 100%);
        color: #f6eee3;
      }
      .v-token .glow {
        display: none;
      }
      .t-copy {
        left: 104px;
        top: 96px;
      }
      .t-model {
        display: flex;
        align-items: baseline;
        gap: 22px;
        font: 800 104px/1 -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        letter-spacing: -0.015em;
        color: #ff9d6c;
        white-space: nowrap;
      }
      .t-model small {
        font: 600 76px/1 'PingFang SC', sans-serif;
        color: #f6eee3;
      }
      .t-title {
        margin: 34px 0 0 -8px;
        font: 900 200px/1.08 var(--title);
        letter-spacing: 0.01em;
        white-space: nowrap;
      }
      .t-title .fire {
        background: linear-gradient(180deg, #ffe58a 8%, #ffa23d 52%, #ff4a1c 96%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 36px rgba(255, 96, 28, 0.55));
      }
      .t-title .tok {
        display: block;
        margin-top: -6px;
        font: 900 236px/1 -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        letter-spacing: -0.03em;
      }
      .t-made {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        margin-top: 40px;
        padding: 18px 34px 18px 20px;
        border-radius: 999px;

    <script type="module">
      import { Mascot, Buddy, AppWin, Bubble, C, FONT, s, g, T, place, polyD, sharpD, rectD, lineD, ellipseD, starD, sparkleD, heartD, sticky } from './sketch.js';

      const q = new URLSearchParams(location.search);
      const v = q.get('v') || 'board';
      const r = q.get('r') || '16x9';
      const wide = r !== '3x4';
      document.body.className = `r${r} v-${v}`;
      document.getElementById('v').append(document.getElementById(v).content.cloneNode(true));
      const ink = document.getElementById('ink');
      ink.setAttribute('viewBox', { '3x4': '0 0 1080 1440', '4x3': '0 0 1440 1080' }[r] || '0 0 1920 1080');
      const at = (e, x, y, rot = 0) => Object.assign(e.style, { left: x + 'px', top: y + 'px', transform: `rotate(${rot}deg)` });
      const pen = (color) => ({ fill: 'none', stroke: color, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
      const sparkle = (x, y, R, fill) => s('path', { d: sparkleD(x, y, R), fill, stroke: C.ink, 'stroke-width': 4, 'stroke-linejoin': 'round' }, ink);
      const star = (x, y, R, fill) => s('path', { d: starD(x, y, R, 5), fill, stroke: C.ink, 'stroke-width': 4, 'stroke-linejoin': 'round' }, ink);

      const draw = {
        paper() {
          // 「一本书」底下一道荧光笔；纸上「有人从头给你讲一遍」被红笔圈起来
          const hl = document.querySelector('.p-title .hl').getBoundingClientRect();
          const my = hl.top + hl.height * 0.7;
          s('path', { d: polyD([[hl.left + 4, my + 3], [hl.left + hl.width / 2, my], [hl.right - 2, my - 4]], 3, 2), fill: 'none', stroke: '#ecc96a', 'stroke-width': 38, 'stroke-linecap': 'round', opacity: 0.6, style: 'mix-blend-mode: multiply' }, ink);
          const ci = document.querySelector('.p-sheet .circ').getBoundingClientRect();
          const cx = ci.left + ci.width / 2;
          const cy = ci.top + ci.height / 2;
          s('path', { d: ellipseD(cx, cy, ci.width / 2 + 22, ci.height / 2 + 4, 4, 1.8, 0.16, -2.6), fill: 'none', stroke: '#c8402f', 'stroke-width': 4, 'stroke-linecap': 'round', transform: `rotate(5 ${cx} ${cy})` }, ink);
          // 手写批注下的一笔
          const n = document.querySelector('.p-note').getBoundingClientRect();
          s('path', { d: `M${n.left + 6} ${n.bottom + 4} C${n.left + 200} ${n.bottom - 8}, ${n.right - 220} ${n.bottom + 12}, ${n.right - 10} ${n.bottom - 14}`, fill: 'none', stroke: '#c8402f', 'stroke-width': 4, 'stroke-linecap': 'round' }, ink);

        hook() {
          const red = '#d6453a';
          const w = document.querySelector('.h-math .wrong').getBoundingClientRect();
          const cx = w.left + w.width / 2;
          const cy = w.top + w.height / 2 + 4;
          s('path', { d: ellipseD(cx + 10, cy, w.width / 2 + 14, w.height / 2 + 4, 7, 2.2, 0.16, -2.5), fill: 'none', stroke: red, 'stroke-width': 6, 'stroke-linecap': 'round' }, ink);
          // 从圈指向批注的一笔
          const f = document.querySelector('.h-fix').getBoundingClientRect();
          const x0 = w.right + 30;
          const y0 = cy + 10;
          const x1 = f.left + 40;
          const y1 = f.top + 6;
          s('path', { d: `M${x0} ${y0} C${x0 + 60} ${y0 + 20}, ${x1 - 40} ${y1 - 70}, ${x1} ${y1}`, fill: 'none', stroke: red, 'stroke-width': 5, 'stroke-linecap': 'round' }, ink);
          s('path', { d: `M${x1 - 26} ${y1 - 14} L${x1} ${y1} L${x1 + 4} ${y1 - 28}`, fill: 'none', stroke: red, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, ink);
        },
        token() {
          // 底下往上飘的火星，固定种子每次一样；不落在截图和胶囊上（截图这时还没撑开，按它最后占的地方算）
          let seed = 7;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const W = r === '4x3' ? 1440 : 1920;
          const shot = r === '4x3' ? { left: 820, right: W, top: 500, bottom: 1080 } : { left: 1095, right: W, top: 110, bottom: 975 };
          const keep = [shot, document.querySelector('.t-made').getBoundingClientRect()];
          for (let i = 0; i < 60; i++) {
            const x = rnd() * W;
            const y = 560 + rnd() * 520;
            const r = 2 + rnd() * 5;
            if (keep.some((b) => x > b.left - 16 && x < b.right + 16 && y > b.top - 16 && y < b.bottom + 16)) continue;
            s('circle', { cx: x, cy: y, r, fill: rnd() < 0.5 ? '#ffb24a' : '#ff6a2a', opacity: 0.35 + rnd() * 0.5, style: `filter: drop-shadow(0 0 ${r * 2}px #ff7a30)` }, ink);
          }
        },
        'token-eq'() {
          // 「数十亿」底下红笔划两道
          const n = document.querySelector('.e-left .n').getBoundingClientRect();
          const y = n.bottom - 30;
          const pen = { fill: 'none', stroke: '#e5402f', 'stroke-width': 11, 'stroke-linecap': 'round' };
          s('path', { d: polyD([[n.left + 6, y + 6], [n.left + n.width / 2, y + 1], [n.right - 2, y - 6]], 5, 2), ...pen }, ink);
          s('path', { d: polyD([[n.left + 40, y + 30], [n.left + n.width / 2 + 10, y + 25], [n.right - 30, y + 20]], 8, 2), ...pen }, ink);
        },
        'token-flap'() {
          // 每个字一块翻牌，空格是空牌
          for (const row of document.querySelectorAll('[data-flap]'))
            for (const ch of row.dataset.flap) row.append(Object.assign(document.createElement('span'), { className: 'flap', textContent: ch.trim() }));
        },
        'token-mascot'() {
          const ink2 = C.ink;
          // 一摞 token 金币，上面烧着火
          const cx = 1215;
          const flame = (x, by, w, h, fill) =>
            s('path', { d: `M${x} ${by} C${x - w} ${by - h * 0.12}, ${x - w * 0.95} ${by - h * 0.55}, ${x - w * 0.15} ${by - h} C${x - w * 0.1} ${by - h * 0.62}, ${x + w * 0.35} ${by - h * 0.7}, ${x + w * 0.42} ${by - h * 0.86} C${x + w * 1.05} ${by - h * 0.5}, ${x + w * 0.9} ${by - h * 0.1}, ${x} ${by} Z`, fill, stroke: ink2, 'stroke-width': 5, 'stroke-linejoin': 'round' }, ink);
          flame(cx, 905, 150, 380, '#ff7a45');
          flame(cx + 6, 900, 88, 230, C.yellow);
          for (let i = 0; i < 5; i++) {
            const y = 990 - i * 30;
            const x = cx + [0, 8, -6, 10, -2][i];
            s('path', { d: `M${x - 96} ${y} L${x - 96} ${y + 26} A96 26 0 0 0 ${x + 96} ${y + 26} L${x + 96} ${y} Z`, fill: '#e2a93a', stroke: ink2, 'stroke-width': 4.5, 'stroke-linejoin': 'round' }, ink);
            s('ellipse', { cx: x, cy: y, rx: 96, ry: 26, fill: C.gold, stroke: ink2, 'stroke-width': 4.5 }, ink);
          }
          T(ink, 'token', cx - 2, 880 + 12, { font: FONT.latin, size: 34, weight: 700, anchor: 'middle', fill: ink2 });
          // 散在地上的两枚
          for (const [x, y] of [[1040, 1020], [1385, 1030]]) {
            s('ellipse', { cx: x, cy: y + 8, rx: 46, ry: 14, fill: '#e2a93a', stroke: ink2, 'stroke-width': 4 }, ink);
            s('ellipse', { cx: x, cy: y, rx: 46, ry: 14, fill: C.gold, stroke: ink2, 'stroke-width': 4 }, ink);
          }
          new Mascot(ink).set({ x: 1630, y: 1012, scale: 2.05, mood: 'wow', sweat: true, raiseL: 110, raiseR: 110, sway: 4 });
          new Bubble(ink, { x: 1600, y: 236, w: 480, h: 124, tail: [1585, 372], lines: ['我这么贵吗？！'], size: 60 }).show(10, 0);
          sparkle(1030, 600, 26, C.yellow);
          star(1840, 470, 24, C.pink);
          sparkle(1380, 560, 18, C.sky);
        },
        intro() {
          const red = '#e8505b';
          // 标题上的批注：「画重点」底下一道荧光笔，「讲题」被红笔圈起来
          const hl = document.querySelector('.hl').getBoundingClientRect();
          const my = hl.top + hl.height * 0.62;
          s('path', { d: polyD([[hl.left + 4, my + 3], [hl.left + hl.width / 2, my - 1], [hl.right - 4, my - 4]], 3, 2), fill: 'none', stroke: C.yellow, 'stroke-width': 50, 'stroke-linecap': 'round', opacity: 0.9, style: 'mix-blend-mode: multiply' }, ink);
          const ci = document.querySelector('.circ').getBoundingClientRect();
          s('path', { d: ellipseD(ci.left + ci.width / 2, ci.top + ci.height / 2 + 4, ci.width / 2 + 12, ci.height / 2 - 4, 4, 2.5, 0.16, -2.6), fill: 'none', stroke: red, 'stroke-width': 8, 'stroke-linecap': 'round' }, ink);

          // 简笔画的页间窗口，换成不限于论文的书架和笔记
          const win = new AppWin(ink, { w: 860, h: 600, seed: 11 });
          place(win.root, 990, 150, 1, -2.5);
          ['工作空间', '我的书架', '课程', '笔记.html', '讲义.pdf', '书单.html'].forEach((l, i) => {
            win.sideText[i].textContent = l;
            if (i) win.sideText[i].setAttribute('font-size', 21);
            if (i === 3 || i === 4) win.sideText[i].setAttribute('x', +win.sideText[i].getAttribute('x') - 10);
          });
          Object.assign(win.docTitle, { textContent: '我的读书笔记' });
          win.docTitle.setAttribute('font-family', FONT.hand);
          win.docTitle.setAttribute('font-size', 40);
          win.docTitle.setAttribute('font-weight', 700);
          const dx = win.sb + 60;
          const dw = 860 - win.sb - 150;
          s('path', { d: ellipseD(dx + 200, 334, 150, 24, 6, 2, 0.14, -2.4), fill: 'none', stroke: red, 'stroke-width': 5.5, 'stroke-linecap': 'round' }, win.root);
          sticky(win.root, { x: dx + dw - 70, y: 200, w: 226, h: 118, color: C.pinkL, rot: 7, lines: ['这段要考！'], size: 36 });

          // 白板：页老师讲题
          const B = g(ink, { transform: 'translate(1290 584) rotate(3)' });
          const W = 530;
          const H = 330;
          s('path', { d: rectD(0, 0, W, H, 20, 7, 1.6), fill: 'rgba(61,58,75,.14)', transform: 'translate(12 14)' }, B);
          s('path', { d: rectD(0, 0, W, H, 20, 7, 1.6), fill: '#fffef7', stroke: C.ink, 'stroke-width': 4.5 }, B);
          for (let x = 30; x < W - 10; x += 28) for (let y = 78; y < H - 10; y += 28) s('circle', { cx: x, cy: y, r: 2, fill: '#e6dfcf' }, B);
          s('path', { d: lineD(4, 56, W - 4, 56, 9, 1), stroke: C.ink, 'stroke-width': 3.5, fill: 'none' }, B);
          T(B, '白板讲解', 26, 40, { size: 30, weight: 700 });
          s('path', { d: sharpD([[60, 272], [60, 104], [230, 272]], 5, 1.2, true), fill: C.skyL, stroke: C.blue, 'stroke-width': 5, 'stroke-linejoin': 'round' }, B);
          s('path', { d: 'M60 248 L84 248 L84 272', fill: 'none', stroke: C.blue, 'stroke-width': 4 }, B);
          T(B, 'a', 26, 200, { font: FONT.latin, size: 38, fill: C.blue });
          T(B, 'b', 132, 314, { font: FONT.latin, size: 38, fill: C.blue });
          T(B, 'c', 156, 176, { font: FONT.latin, size: 38, fill: C.blue });
          const f1 = T(B, 'a² + b² =', 282, 170, { font: FONT.latin, size: 38 });
          const fx = 282 + f1.getComputedTextLength() + 14;
          const f2 = T(B, 'c²', fx, 170, { font: FONT.latin, size: 38, fill: red });
          const fw = fx + f2.getComputedTextLength() - 282;
          s('path', { d: rectD(266, 118, fw + 34, 70, 10, 8, 1.4), fill: 'none', stroke: '#3bb273', 'stroke-width': 5 }, B);
          s('path', { d: ellipseD(fx + f2.getComputedTextLength() / 2, 156, 30, 32, 9, 1.6, 0.18, -2), fill: 'none', stroke: red, 'stroke-width': 4.5, 'stroke-linecap': 'round' }, B);
          T(B, '一步步', 286, 248, { size: 34, fill: '#2f8a78', weight: 700 });
          T(B, '讲给你听 ～', 286, 292, { size: 34, fill: '#2f8a78', weight: 700 });

          // 戴眼镜的小页（页老师）指着白板；AI 小星在窗口右上角
          new Mascot(ink).set({ x: 1150, y: 1000, scale: 1.02, mood: 'happy', glasses: true, raiseL: -10, raiseR: 100, sway: -8 });
          new Buddy(ink, C.violet).set({ x: 1806, y: 196, scale: 0.6, t: 0.6 });
          new Bubble(ink, { x: 1470, y: 84, w: 330, h: 88, tail: [1720, 160], lines: ['看不懂？问我～'], size: 38 }).show(10, 0);

          sparkle(905, 190, 26, C.yellow);
          star(880, 700, 22, C.pink);
          sparkle(1880, 560, 20, C.sky);
          s('path', { d: heartD(915, 560, 18), fill: C.mint, stroke: C.ink, 'stroke-width': 4 }, ink);
        },
        board() {
          // 戴眼镜的小页就是页老师：站在白板左下角，举手指着白板
          new Mascot(ink).set(wide ? { x: 950, y: 1046, scale: 1.2, mood: 'happy', glasses: true, raiseL: -10, raiseR: 100, sway: -8 }
                                   : { x: 890, y: 1420, scale: 1.05, mood: 'happy', glasses: true, raiseL: -10, raiseR: 100, sway: -8 });
          const p = pen('#d6453a');
          if (wide) {
            s('path', { d: polyD([[1712, 900], [1738, 846], [1752, 790], [1756, 730]], 4, 2), ...p }, ink);
            s('path', { d: 'M1734 752 L1756 726 L1776 754', ...p }, ink);
          } else {
            s('path', { d: polyD([[930, 712], [952, 770], [964, 830], [966, 880]], 4, 2), ...p }, ink);
            s('path', { d: 'M944 858 L966 884 L986 856', ...p }, ink);
          }
        },
        annotate() {
          if (wide) {
            star(770, 300, 44, '#ffd25e');
            sparkle(860, 230, 22, '#ff9fb6');
          } else {
            star(880, 320, 48, '#ffd25e');
            sparkle(980, 250, 24, '#ff9fb6');
          }
        },
        ai() {
          // AI 小星：宣传片里的 AI 角色
          new Buddy(ink, C.violet).set(wide ? { x: 905, y: 905, scale: 0.8, t: 0.6 } : { x: 920, y: 860, scale: 0.75, t: 0.6 });
        },
        themes() {
          const cards = [...document.querySelectorAll('[data-theme]')];
          const [x0, y0, dx, dy] = wide ? [1260, 150, -95, 96] : [330, 778, -72, 46];
          cards.forEach((c, i) => at(c, x0 + dx * i, y0 + dy * i, -2));
        },
        cute() {
          new Mascot(ink).set(wide ? { x: 560, y: 1010, scale: 2.25, mood: 'happy', raiseL: 100, raiseR: 100, sway: -10 }
                                   : { x: 540, y: 1392, scale: 2.0, mood: 'happy', raiseL: 100, raiseR: 100, sway: -10 });
          const spots = wide
            ? [[150, 250, -8], [450, 150, 4], [760, 210, -5], [40, 560, 5], [60, 820, -4], [850, 900, 6]]
            : [[60, 800, -8], [820, 790, 6], [24, 1040, 5], [830, 960, -5], [40, 1270, -4], [770, 1290, 5]];
          document.querySelectorAll('.sticker').forEach((e, i) => at(e, ...spots[i]));
          const deco = wide
            ? [[sparkle, 1700, 200, 30, C.yellow], [star, 1780, 860, 34, C.violet], [sparkle, 1150, 960, 22, C.sky], [star, 340, 120, 20, C.pink], [sparkle, 1000, 140, 18, C.pink]]
            : [[sparkle, 140, 140, 28, C.yellow], [star, 950, 170, 30, C.violet], [sparkle, 960, 560, 20, C.sky], [star, 110, 600, 22, C.pink]];
          for (const [f, ...a] of deco) f(...a);
          s('path', { d: heartD(wide ? 905 : 170, wide ? 455 : 960, 22), fill: C.mint, stroke: C.ink, 'stroke-width': 4 }, ink);
        },
      };
      await document.fonts.ready;
      draw[v]?.();

      // 截图裁切：data-box 是原图上的 x y w h，按元素宽度缩放
      const NAT = { 'hero.webp': 2400, 'board.webp': 2400, 'reading.webp': 2400, 'annotate.webp': 2000, 'ai-highlights.webp': 2000, 'ai-translate.webp': 1280 };
      const crops = [...document.querySelectorAll('.crop')];
      await Promise.all([...new Set(crops.map((c) => c.dataset.src))].map((src) => Object.assign(new Image(), { src: '/site/' + src }).decode()));
      for (const c of crops) {
        const [x, y, w, h] = c.dataset.box.split(' ').map(Number);
        const k = c.clientWidth / w;
        Object.assign(c.style, {
          height: h * k + 'px',
          backgroundImage: `url(/site/${c.dataset.src})`,
          backgroundSize: `${(NAT[c.dataset.src] || 2000) * k}px auto`,
          backgroundPosition: `${-x * k}px ${-y * k}px`,
        });
      }
      await document.fonts.ready;
      document.body.dataset.ready = '1';
    </script>
  </body>
</html>
