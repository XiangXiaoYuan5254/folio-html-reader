<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>插件 · 页间 Folio</title>
    <meta name="description" content="页间的插件在应用里安装：打开「设置 › 插件」，一键装上。" />
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .plugins-header, .plugins-main, .plugins-footer { width: min(760px, calc(100% - 40px)); margin: auto; }
      .plugins-header { padding: 28px 0; }
      .plugins-brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }
      .plugins-main { padding: 36px 0 20px; }
      .plugins-main h1 { margin: 14px 0 16px; font-size: clamp(30px, 5.5vw, 42px); }
      .plugins-intro { max-width: 560px; color: var(--ink-2); }
      .plugin-entry { display: flex; gap: 18px; align-items: flex-start; margin-top: 36px; padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
      .plugin-entry img { flex: none; width: 52px; height: 52px; border-radius: 12px; }
      .plugin-entry h2 { margin: 2px 0 6px; font-size: 19px; }
      .plugin-entry p { margin: 0; color: var(--ink-2); }
      .plugin-entry .plugin-meta { margin-top: 10px; font-size: 13px; color: var(--ink-3); }
      .plugins-actions { margin-top: 32px; }
      .plugins-footer { padding: 36px 0 44px; color: var(--ink-3); font-size: 14px; }
      @media (max-width: 560px) { .plugin-entry { padding: 20px; gap: 14px; } }
    </style>
  </head>
  <body>
    <header class="plugins-header">
      <a class="plugins-brand" href="../"><img src="../assets/icon.svg" width="28" height="28" alt="" />页间 Folio</a>
    </header>
    <main class="plugins-main">
      <p class="eyebrow">插件</p>
      <h1>插件在页间里安装</h1>
      <p class="plugins-intro">打开页间的「设置 › 插件」，在官方插件里点一下就装好，不用来这里下载。</p>
      <article class="plugin-entry" aria-labelledby="plugin-name">
        <img src="{{icon}}" alt="" />
        <div>
          <h2 id="plugin-name">{{name}}</h2>
          <p>{{description}}</p>
          <p class="plugin-meta">官方插件 · {{version}} · 需要页间 {{since}} 或更新版本</p>
        </div>
      </article>
      <p class="plugins-actions"><a class="btn btn-primary" href="../#download">下载页间</a></p>
    </main>
    <footer class="plugins-footer"><a href="../">返回页间官网</a></footer>
  </body>
</html>
