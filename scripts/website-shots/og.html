<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#f6f3ec;font-family:-apple-system,"PingFang SC",sans-serif;position:relative}
body::before{content:'';position:absolute;inset:0;background-image:repeating-linear-gradient(to bottom,transparent 0 39px,rgba(34,89,77,.07) 39px 40px);-webkit-mask-image:linear-gradient(90deg,#000 30%,transparent 70%)}
.glow{position:absolute;right:-120px;top:40px;width:900px;height:600px;background:radial-gradient(closest-side,rgba(61,133,116,.25),transparent),radial-gradient(closest-side at 70% 60%,rgba(226,187,99,.3),transparent);filter:blur(30px)}
.copy{position:absolute;left:84px;top:92px;width:600px}
.brand{display:flex;align-items:center;gap:14px;font:700 30px/1 "Songti SC",serif;color:#1b211e;letter-spacing:.06em}
.brand img{width:52px;height:52px}
.brand span{font:500 28px/1 "Iowan Old Style",Palatino,serif;color:#464e49;letter-spacing:0}
h1{margin-top:56px;font:700 74px/1.2 "Songti SC",serif;color:#1b211e;letter-spacing:.02em}
mark{background:linear-gradient(transparent 56%,rgba(226,187,99,.5) 56% 90%,transparent 90%);color:inherit}
p{margin-top:30px;font-size:22px;line-height:1.65;color:#464e49}
.meta{margin-top:18px;font-size:18px;color:#7a817c}
.shot{position:absolute;left:720px;top:118px;width:760px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(22,44,38,.08),0 30px 60px -14px rgba(22,52,44,.35)}
.shot img{display:block;width:100%}
.lights{position:absolute;left:7px;top:11px;display:flex;gap:4px}
.lights i{width:6px;height:6px;border-radius:50%;background:#ff5f57}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
</style>
</head>
<body>
<div class="glow"></div>
<div class="copy">
  <div class="brand"><img src="../../website/assets/icon.svg" alt="">页间<span>Folio</span></div>
  <h1>读 HTML，<br>像读<mark>一本书</mark>。</h1>
  <p>本地阅读 HTML 与 PDF，高亮、批注、改源码；<br>AI 引用原文回答，页老师在白板上讲给你听。</p>
  <div class="meta">macOS · Windows · 免费下载</div>
</div>
<div class="shot"><span class="lights"><i></i><i></i><i></i></span><img src="../../website/assets/hero.webp" alt=""></div>
</body>
</html>
